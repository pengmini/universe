<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>모든 별 뜨는 시간 따로 있지 - 로그인</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="./app/ui.css">
<style>
  body{display:grid; place-items:center; min-height:100dvh; padding:24px}
  .gate{width:min(420px,100%); text-align:center}
  .gate .orb{
    width:96px; height:96px; margin:0 auto 20px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #FFF2D2, #E8604F 42%, #3D9AE0 78%, #241442);
    box-shadow:0 0 60px rgba(61,154,224,.35), inset -8px -10px 24px rgba(0,0,0,.5);
  }
  .gate h1{font-size:30px; margin:0 0 6px}
  .gate .lede{color:var(--ink2); font-size:13.5px; margin:0 0 26px; line-height:1.6}
  .gbtn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background:#fff; color:#1F2430; border:0; border-radius:11px;
    padding:13px 18px; font-size:15px; font-weight:600;
  }
  .gbtn:hover{background:#EEF2F8}
  .gbtn svg{width:19px; height:19px; flex:none}
  .err{
    margin-top:16px; font-size:13px; color:var(--bad); line-height:1.6;
    background:rgba(255,143,166,.08); border:1px solid rgba(255,143,166,.3);
    border-radius:10px; padding:11px 13px; text-align:left;
  }
  .foot{margin-top:22px; font-size:11.5px; color:var(--ink3); line-height:1.6}
  .demo-row{display:flex; gap:8px}
  .demo-row .btn{flex:1; text-decoration:none; text-align:center}
</style>
</head>
<body>
<div class="veil" id="veil"><div class="box"><div class="spin"></div><p>확인하는 중…</p></div></div>

<main class="gate" id="gate" hidden>
  <div class="orb"></div>
  <h1>모든 별 뜨는 시간 따로 있지</h1>
  <p class="lede">구글 계정으로 들어오면 내 이름이 자동으로 붙어요.<br>선생님은 전자칠판 화면으로, 학생은 응답 화면으로 갑니다.</p>
  <button class="gbtn" id="login">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.3 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.3-4.6 7l7.6 5.9c4.4-4.1 6.7-10.1 6.7-17.4z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.7-3.8-13.6-9.9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    구글 계정으로 시작하기
  </button>
  <div class="err" id="err" hidden></div>

  <p class="foot" style="margin:22px 0 8px">시연용 — 로그인 없이 화면만 보기</p>
  <div class="demo-row">
    <a class="btn" href="./student.html?demo=1">학생용 화면</a>
    <a class="btn" href="./teacher.html?demo=1">교사용 화면</a>
  </div>

  <p class="foot">프로토타입</p>
</main>

<script type="module">
import { auth, login, roleOf, settleRedirect } from "./app/auth.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const veil = document.getElementById("veil");
const gate = document.getElementById("gate");
const err  = document.getElementById("err");

await settleRedirect();                        // 리디렉션으로 돌아온 경우 처리

onAuthStateChanged(auth, user => {
  if (user){                                   // 역할에 따라 갈라 보낸다
    location.replace(roleOf(user) === "teacher" ? "./teacher.html" : "./student.html");
    return;
  }
  veil.hidden = true; gate.hidden = false;
});

document.getElementById("login").addEventListener("click", async () => {
  err.hidden = true;
  try { await login(); }
  catch (e) {
    err.hidden = false;
    const MSG = {
      "auth/unauthorized-domain":
        "이 주소가 Firebase에 등록돼 있지 않아요. 콘솔 → Authentication → 설정 → 승인된 도메인에 지금 주소를 추가해 주세요.",
      "app/popup-blocked":
        "브라우저가 로그인 창을 막았어요. 주소창 오른쪽 끝의 차단 아이콘을 눌러 팝업을 허용한 뒤 다시 시도해 주세요.",
      "auth/network-request-failed":
        "구글 인증 서버에 연결하지 못했어요. 네트워크나 광고 차단 확장 프로그램을 확인해 주세요.",
      "auth/operation-not-allowed":
        "구글 로그인이 아직 켜져 있지 않아요. 콘솔 → Authentication → Sign-in method → Google 을 사용 설정해 주세요.",
    };
    err.textContent = MSG[e.code] || ("로그인하지 못했어요: " + (e.code || e.message));
  }
});
</script>
</body>
</html>
